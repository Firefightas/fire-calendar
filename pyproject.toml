[project]
name = "fire-calendar"
version = "0.1.0"
description = "Harmonized MODIS + VIIRS burning activity calendar (NASA Space Apps 2026, Challenge #9)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
pipeline = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "h3>=4.0",
    "pyarrow>=15",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
]
backend = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "duckdb>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "h3>=4.0",
    "shapely>=2.1",
]
dev = [
    "pytest>=8",
    "jsonschema>=4.21",
    "ruff>=0.4",
    "httpx>=0.27",
]

[tool.uv]
default-groups = ["pipeline", "backend", "dev"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "pipeline", "backend"]
